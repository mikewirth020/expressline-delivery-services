<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .login-box .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 6px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Driver Login</h1>

        <p class="subtitle">
            Sign in to your driver account
        </p>

        <div id="error" class="error">
            Please enter your driver ID and password.
        </div>

        <form onsubmit="driverLogin(event)">

            <div class="form-group">
                <label for="driverId">Driver ID</label>

                <input
                    type="text"
                    id="driverId"
                    placeholder="Example: DRV-001"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Sign In
            </button>

        </form>

        <div class="links">
            <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <div class="links">
            <a href="index.html">Back to Home</a>
        </div>

        <div class="demo">
            <strong>Demo Driver:</strong><br>
            Driver ID: DRV-001<br>
            Password: demo123
        </div>

    </div>

    <script>
        function driverLogin(event) {
            event.preventDefault();

            const driverId = document.getElementById("driverId").value.trim();
            const password = document.getElementById("password").value.trim();
            const error = document.getElementById("error");

            if (driverId === "" || password === "") {
                error.style.display = "block";
                return;
            }

            error.style.display = "none";

            window.location.href = "driver-dashboard.html";
        }
    </script>

</body>
</html>
