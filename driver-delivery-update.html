<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Delivery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 6px;
            color: #d1d5db;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #f9fafb;
            padding: 15px;
            border-radius: 7px;
            border: 1px solid #e5e7eb;
        }

        .detail strong {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .back {
            background: #6b7280;
            margin-left: 8px;
        }

        .back:hover {
            background: #4b5563;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
        }

        @media (max-width: 600px) {
            .details {
                grid-template-columns: 1fr;
            }

            .back {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Update Delivery</h1>
        <p>Driver Shipment Status Update</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Shipment Information</h2>

            <div class="details">

                <div class="detail">
                    <strong>Shipment ID</strong>
                    TRK-10001
                </div>

                <div class="detail">
                    <strong>Customer</strong>
                    John Smith
                </div>

                <div class="detail">
                    <strong>Pickup</strong>
                    Newark, NJ
                </div>

                <div class="detail">
                    <strong>Destination</strong>
                    New York, NY
                </div>

                <div class="detail">
                    <strong>Driver</strong>
                    James Wilson
                </div>

                <div class="detail">
                    <strong>Vehicle</strong>
                    Ford Transit
                </div>

            </div>
        </div>

        <div class="card">
            <h2>Update Shipment Status</h2>

            <form onsubmit="saveUpdate(event)">

                <div class="form-group">
                    <label for="status">Shipment Status</label>

                    <select id="status" required>
                        <option value="">Select Status</option>
                        <option value="Picked Up">Picked Up</option>
                        <option value="In Transit">In Transit</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                        <option value="Delivery Attempted">Delivery Attempted</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Delivery Notes</label>

                    <textarea id="notes"
                        placeholder="Enter delivery notes or additional information..."></textarea>
                </div>

                <button type="submit" class="button">
                    Save Update
                </button>

                <a href="driver-dashboard.html" class="button back">
                    Cancel
                </a>

                <div id="message" class="message">
                    Shipment status has been updated successfully.
                </div>

            </form>
        </div>

    </div>

    <script>
        function saveUpdate(event) {
            event.preventDefault();

            const status = document.getElementById("status").value;
            const message = document.getElementById("message");

            if (!status) {
                alert("Please select a shipment status.");
                return;
            }

            message.style.display = "block";

            message.textContent =
                "TRK-10001 updated to " + status + ".";

            setTimeout(function () {
                window.location.href = "driver-dashboard.html";
            }, 1500);
        }
    </script>

</body>
</html>
