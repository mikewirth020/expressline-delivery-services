<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Vehicle</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        header p {
            margin-top: 6px;
            color: #d1d5db;
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #f9fafb;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .detail strong {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .button {
            padding: 11px 17px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .back {
            background: #6b7280;
            margin-left: 8px;
        }

        .back:hover {
            background: #4b5563;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .details {
                grid-template-columns: 1fr;
            }

            .back {
                margin-left: 0;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Vehicle</h1>
        <p>Driver Vehicle Information</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Current Vehicle</h2>

            <div class="details">

                <div class="detail">
                    <strong>Driver</strong>
                    James Wilson
                </div>

                <div class="detail">
                    <strong>Driver ID</strong>
                    DRV-001
                </div>

                <div class="detail">
                    <strong>Vehicle</strong>
                    Ford Transit
                </div>

                <div class="detail">
                    <strong>Vehicle ID</strong>
                    TRK-10001
                </div>

                <div class="detail">
                    <strong>License Plate</strong>
                    NJ-FT-1001
                </div>

                <div class="detail">
                    <strong>Vehicle Status</strong>
                    Active
                </div>

            </div>
        </div>

        <div class="card">
            <h2>Update Vehicle Information</h2>

            <form onsubmit="saveVehicle(event)">

                <div class="form-group">
                    <label for="vehicleType">Vehicle Type</label>

                    <select id="vehicleType" required>
                        <option value="Ford Transit">Ford Transit</option>
                        <option value="Mercedes Sprinter">Mercedes Sprinter</option>
                        <option value="Ram ProMaster">Ram ProMaster</option>
                        <option value="Chevrolet Express">Chevrolet Express</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="vehicleId">Vehicle ID</label>

                    <input
                        type="text"
                        id="vehicleId"
                        value="TRK-10001"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="licensePlate">License Plate</label>

                    <input
                        type="text"
                        id="licensePlate"
                        value="NJ-FT-1001"
                        required
                    >
                </div>

                <button type="submit" class="button">
                    Save Changes
                </button>

                <a href="driver-dashboard.html" class="button back">
                    Back to Dashboard
                </a>

                <div id="message" class="message">
                    Vehicle information updated successfully.
                </div>

            </form>
        </div>

    </div>

    <script>
        function saveVehicle(event) {
            event.preventDefault();

            const message = document.getElementById("message");

            message.style.display = "block";

            setTimeout(function() {
                message.style.display = "none";
            }, 3000);
        }
    </script>

</body>
</html>
