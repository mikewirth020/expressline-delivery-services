<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Logistics Company</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;
            color: #111827;
            font-size: 28px;
        }

        .logo p {
            margin-top: 8px;
            color: #6b7280;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .demo {
            margin-top: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            color: #4b5563;
        }

        .demo strong {
            color: #111827;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            <h1>Admin Login</h1>
            <p>Logistics Company</p>
        </div>

        <div id="errorMessage" class="error">
            Incorrect email or password.
        </div>

        <form id="adminLoginForm">

            <label for="email">Admin Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login as Admin
            </button>

        </form>

        <div class="demo">
            <strong>Demo Admin Login</strong><br><br>
            Email: admin@logistics.com<br>
            Password: admin123
        </div>

        <a href="index.html" class="back">
            ← Back to Homepage
        </a>

    </div>

</div>

<script>
    document.getElementById("adminLoginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const correctEmail = "admin@logistics.com";
        const correctPassword = "admin123";

        const errorMessage = document.getElementById("errorMessage");

        if (email === correctEmail && password === correctPassword) {

            localStorage.setItem("adminLoggedIn", "true");

            window.location.href = "admin.html";

        } else {

            errorMessage.style.display = "block";

        }

    });
</script>

</body>
</html>
