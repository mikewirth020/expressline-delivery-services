<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ExpressLine Delivery Services</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #111827;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <p class="subtitle">
        ExpressLine Delivery Services
    </p>

    <div id="errorMessage" class="error">
        Incorrect admin email or password.
    </div>

    <form id="adminLoginForm">

        <label for="email">Admin Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="index.html" class="back">
        ← Back to Homepage
    </a>

</div>

<script>
    document.getElementById("adminLoginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const adminEmail = "admin@logistics.com";
        const adminPassword = "admin123";

        if (email === adminEmail && password === adminPassword) {

            localStorage.setItem("adminLoggedIn", "true");

            window.location.href = "admin.html";

        } else {

            document.getElementById("errorMessage").style.display = "block";

        }

    });
</script>

</body>
</html>
