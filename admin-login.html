<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 7px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <div id="error" class="error">
        Incorrect admin email or password.
    </div>

    <form id="loginForm">

        <label for="email">Admin Email</label>

        <input
            type="email"
            id="email"
            placeholder="admin@logistics.com"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a class="back" href="index.html">
        ← Back to Homepage
    </a>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (
        email === "admin@logistics.com" &&
        password === "admin123"
    ) {

        localStorage.setItem("adminLoggedIn", "true");

        /*
         * Admin Dashboard is in the same folder.
         */
        window.location.assign("./admin-dashboard.html");

    } else {

        document.getElementById("error").style.display = "block";

    }

});
</script>

</body>
</html>
