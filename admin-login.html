<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | ExpressLine</title>

  <meta
    name="description"
    content="Secure admin login for ExpressLine Delivery Services."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #172033;
      color: #172033;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: #e30613;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      color: #172033;
    }

    .subtitle {
      margin: 10px 0 28px;
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #172033;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #e30613;
      box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.1);
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      background: #e30613;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff1f2;
      color: #b42318;
      border: 1px solid #fecdca;
    }

    .message.success {
      display: block;
      background: #ecfdf3;
      color: #027a48;
      border: 1px solid #abefc6;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #172033;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 20px;
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <div class="logo">EL</div>

      <h1>Admin Login</h1>

      <p class="subtitle">
        Sign in to manage ExpressLine Delivery Services.
      </p>

      <form id="adminLoginForm">

        <div class="form-group">
          <label for="adminEmail">Email Address</label>

          <input
            type="email"
            id="adminEmail"
            placeholder="Enter your admin email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>

          <input
            type="password"
            id="adminPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" id="loginButton">
          Sign In
        </button>

        <div id="loginMessage" class="message"></div>

      </form>

      <a href="index.html" class="back-link">
        ← Back to Website
      </a>

      <div class="security-note">
        Secure administrator access powered by Supabase.
      </div>

    </section>

  </main>


  <!-- Supabase JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://uhjgietvznkfzckmxqfz.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_zZ0JiBW-2uarX2gnR5w9hQ_77RpB6SM";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    const loginForm = document.getElementById("adminLoginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");


    function showMessage(message, type) {
      loginMessage.textContent = message;
      loginMessage.className = "message " + type;
    }


    function clearMessage() {
      loginMessage.textContent = "";
      loginMessage.className = "message";
    }


    async function checkExistingSession() {

      const {
        data: { session },
        error
      } = await supabaseClient.auth.getSession();

      if (error) {
        console.error("Session check error:", error);
        return;
      }

      if (session) {

        localStorage.setItem(
          "adminLoggedIn",
          "true"
        );

        window.location.replace("admin.html");
      }
    }


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      clearMessage();

      const email =
        document.getElementById("adminEmail").value.trim();

      const password =
        document.getElementById("adminPassword").value;


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "Signing In...";


      try {

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


        if (error) {
          throw error;
        }


        if (!data || !data.session) {

          throw new Error(
            "Login was successful, but no secure session was created."
          );
        }


        /*
          Keep the old local flag temporarily so the existing
          Admin pages can continue working while we migrate
          the remaining Admin pages to Supabase.
        */
        localStorage.setItem(
          "adminLoggedIn",
          "true"
        );


        showMessage(
          "Login successful. Opening Admin Dashboard...",
          "success"
        );


        setTimeout(function() {

          window.location.replace("admin.html");

        }, 500);


      } catch (error) {

        console.error("Admin login error:", error);

        let message =
          "Unable to sign in. Please check your email and password.";

        if (error && error.message) {

          if (
            error.message.toLowerCase().includes("email not confirmed")
          ) {
            message =
              "Your Supabase email has not been confirmed yet.";
          }

          else if (
            error.message.toLowerCase().includes("invalid login")
          ) {
            message =
              "Invalid email or password.";
          }

          else {
            message = error.message;
          }
        }

        showMessage(
          message,
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "Sign In";
      }

    });


    /*
      Check whether the administrator already has
      an active Supabase session.
    */
    checkExistingSession();

  </script>

</body>
</html>
