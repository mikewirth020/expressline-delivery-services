<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Shipments | ExpressLine Admin</title>

  <meta
    name="description"
    content="Manage ExpressLine Delivery Services shipments."
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #0b3d91;
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    nav a:hover,
    nav a.active {
      background: rgba(255, 255, 255, 0.18);
    }

    .container {
      width: min(1200px, 94%);
      margin: 30px auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      margin: 0;
      color: #0b3d91;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 11px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #0b3d91;
      color: #fff;
    }

    .btn-primary:hover {
      background: #082f70;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-warning {
      background: #f59e0b;
      color: #fff;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.07);
      padding: 22px;
      margin-bottom: 25px;
    }

    .card h3 {
      margin-top: 0;
      color: #0b3d91;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
      background: #fff;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #0b3d91;
      box-shadow: 0 0 0 2px rgba(11, 61, 145, 0.1);
    }

    .section-title {
      grid-column: 1 / -1;
      margin-top: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
      color: #0b3d91;
      font-size: 16px;
      font-weight: bold;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .message {
      padding: 12px 15px;
      border-radius: 7px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .shipments-list {
      display: grid;
      gap: 15px;
    }

    .shipment-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px;
      background: #fff;
    }

    .shipment-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tracking-number {
      font-size: 18px;
      font-weight: bold;
      color: #0b3d91;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #e0e7ff;
      color: #3730a3;
    }

    .shipment-info {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .info-box {
      background: #f8fafc;
      padding: 10px;
      border-radius: 7px;
    }

    .info-label {
      display: block;
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .info-value {
      font-size: 13px;
      font-weight: 600;
      word-break: break-word;
    }

    .shipment-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .empty {
      text-align: center;
      padding: 35px 20px;
      color: #6b7280;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
    }

    .progress-wrapper {
      margin-top: 12px;
    }

    .progress-bar {
      width: 100%;
      height: 9px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #0b3d91;
      border-radius: 10px;
    }

    .history-item {
      border-left: 3px solid #0b3d91;
      padding: 8px 12px;
      margin-bottom: 8px;
      background: #f8fafc;
      border-radius: 0 6px 6px 0;
    }

    .history-item strong {
      display: block;
      margin-bottom: 3px;
    }

    .small-note {
      color: #6b7280;
      font-size: 12px;
      margin-top: 5px;
    }

    @media (max-width: 800px) {
      .form-grid,
      .shipment-info {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      header {
        align-items: flex-start;
      }

      nav {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>ExpressLine Admin — Shipments</h1>

  <nav>
    <a href="admin.html">Dashboard</a>
    <a href="admin-shipments.html" class="active">Shipments</a>
    <a href="admin-requests.html">Requests</a>
    <a href="index.html">Website</a>

    <a
      href="admin-login.html"
      onclick="logoutAdmin()"
    >
      Logout
    </a>
  </nav>
</header>

<div class="container">

  <div class="top-bar">
    <h2 id="pageTitle">Create Shipment</h2>

    <button
      type="button"
      class="btn btn-secondary"
      onclick="showCreateForm()"
    >
      + New Shipment
    </button>
  </div>

  <div id="message" class="message"></div>

  <div class="card" id="formCard">

    <h3 id="formTitle">Create Shipment</h3>

    <form id="shipmentForm">

      <div class="form-grid">

        <div class="section-title">
          Shipment Information
        </div>

        <div>
          <label for="trackingNumber">
            Tracking Number *
          </label>

          <input
            type="text"
            id="trackingNumber"
            required
            placeholder="Enter tracking number"
          >
        </div>

        <div>
          <label for="status">
            Shipment Status *
          </label>

          <select id="status" required>
            <option value="Pending">Pending</option>
            <option value="Waiting for Pickup">Waiting for Pickup</option>
            <option value="Packaged">Packaged</option>
            <option value="Picked Up">Picked Up</option>
            <option value="Processing">Processing</option>
            <option value="Customs Clearance">Customs Clearance</option>
            <option value="In Transit">In Transit</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>

        <div>
          <label for="shipmentDate">
            Shipment Created Date *
          </label>

          <input
            type="date"
            id="shipmentDate"
            required
          >
        </div>

        <div>
          <label for="estimatedDelivery">
            Estimated Delivery
          </label>

          <input
            type="date"
            id="estimatedDelivery"
          >
        </div>

        <div>
          <label for="progress">
            Progress (%)
          </label>

          <input
            type="number"
            id="progress"
            min="0"
            max="100"
            value="0"
          >
        </div>

        <div>
          <label for="currentLocation">
            Current Location
          </label>

          <input
            type="text"
            id="currentLocation"
            placeholder="Current shipment location"
          >
        </div>

        <div>
          <label for="shipmentType">
            Shipment Type
          </label>

          <select id="shipmentType">
            <option value="">Select shipment type</option>
            <option value="Document">Document</option>
            <option value="Parcel">Parcel</option>
            <option value="Package">Package</option>
            <option value="Cargo">Cargo</option>
            <option value="Freight">Freight</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label for="weight">
            Weight
          </label>

          <input
            type="text"
            id="weight"
            placeholder="e.g. 5 kg"
          >
        </div>

        <div class="section-title">
          Customer Information
        </div>

        <div>
          <label for="customerName">
            Customer Name
          </label>

          <input
            type="text"
            id="customerName"
          >
        </div>

        <div>
          <label for="customerPhone">
            Customer Phone
          </label>

          <input
            type="text"
            id="customerPhone"
          >
        </div>

        <div>
          <label for="customerEmail">
            Customer Email
          </label>

          <input
            type="email"
            id="customerEmail"
          >
        </div>

        <div class="section-title">
          Sender Information
        </div>

        <div>
          <label for="senderName">
            Sender Name
          </label>

          <input
            type="text"
            id="senderName"
          >
        </div>

        <div>
          <label for="senderPhone">
            Sender Phone
          </label>

          <input
            type="text"
            id="senderPhone"
          >
        </div>

        <div class="full">
          <label for="senderAddress">
            Sender Address
          </label>

          <textarea
            id="senderAddress"
          ></textarea>
        </div>

        <div class="section-title">
          Receiver Information
        </div>

        <div>
          <label for="receiverName">
            Receiver Name
          </label>

          <input
            type="text"
            id="receiverName"
          >
        </div>

        <div>
          <label for="receiverPhone">
            Receiver Phone
          </label>

          <input
            type="text"
            id="receiverPhone"
          >
        </div>

        <div class="full">
          <label for="receiverAddress">
            Receiver Address
          </label>

          <textarea
            id="receiverAddress"
          ></textarea>
        </div>

        <div class="section-title">
          Route Information
        </div>

        <div>
          <label for="origin">
            Origin
          </label>

          <input
            type="text"
            id="origin"
            placeholder="Origin"
          >
        </div>

        <div>
          <label for="destination">
            Destination
          </label>

          <input
            type="text"
            id="destination"
            placeholder="Destination"
          >
        </div>

        <div class="section-title">
          Shipment Photo
        </div>

        <div class="full">
          <label for="shipmentImage">
            Optional Shipment Photo
          </label>

          <input
            type="file"
            id="shipmentImage"
            accept="image/*"
          >

          <div
            id="existingPhoto"
            class="small-note"
          ></div>
        </div>

        <div class="section-title">
          Notes
        </div>

        <div class="full">
          <label for="notes">
            Shipment Notes
          </label>

          <textarea
            id="notes"
            placeholder="Additional shipment information"
          ></textarea>
        </div>

        <div class="section-title">
          Transit / Tracking Update
        </div>

        <div>
          <label for="historyStatus">
            Update Status
          </label>

          <select id="historyStatus">
            <option value="">No new update</option>
            <option value="Shipment Created">Shipment Created</option>
            <option value="Waiting for Pickup">Waiting for Pickup</option>
            <option value="Packaged">Packaged</option>
            <option value="Picked Up">Picked Up</option>
            <option value="Processing">Processing</option>
            <option value="Customs Clearance">Customs Clearance</option>
            <option value="In Transit">In Transit</option>
            <option value="Delivered">Delivered</option>
          </select>
        </div>

        <div>
          <label for="historyLocation">
            Update Location
          </label>

          <input
            type="text"
            id="historyLocation"
            placeholder="Location for this update"
          >
        </div>

        <div class="full">
          <label for="historyNote">
            Update Note
          </label>

          <textarea
            id="historyNote"
            placeholder="Describe this tracking update"
          ></textarea>
        </div>

      </div>

      <div class="form-actions">

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save Shipment
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          onclick="resetForm()"
        >
          Clear
        </button>

      </div>

    </form>

  </div>

  <div class="card">

    <h3>All Shipments</h3>

    <div id="shipmentsList" class="shipments-list"></div>

  </div>

</div>

<script>

/* =========================
   ADMIN ACCESS PROTECTION
========================= */

if (
  localStorage.getItem("adminLoggedIn") !== "true"
) {
  window.location.replace("admin-login.html");
}


/* =========================
   STORAGE
========================= */

const STORAGE_KEY = "expresslineShipments";


/* =========================
   LOGOUT
========================= */

function logoutAdmin() {
  localStorage.removeItem("adminLoggedIn");
}


/* =========================
   ELEMENTS
========================= */

const form =
  document.getElementById(
    "shipmentForm"
  );

const message =
  document.getElementById(
    "message"
  );

const shipmentsList =
  document.getElementById(
    "shipmentsList"
  );

let editingTrackingNumber = null;


/* =========================
   HELPERS
========================= */

function getShipments() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch (error) {

    return [];

  }

}


function saveShipments(
  shipments
) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(shipments)
  );

}


function getText(
  value,
  fallback = ""
) {

  if (
    value === null ||
    value === undefined
  ) {
    return fallback;
  }

  if (
    typeof value === "object"
  ) {
    return fallback;
  }

  return String(value).trim();

}


function getLocation(
  value,
  fallback = ""
) {

  if (
    value === null ||
    value === undefined
  ) {
    return fallback;
  }

  if (
    typeof value === "string"
  ) {
    return value.trim();
  }

  if (
    typeof value === "object"
  ) {

    return getText(
      value.location ||
      value.address ||
      value.city ||
      value.name,
      fallback
    );

  }

  return fallback;

}


function getNumber(
  value,
  fallback = 0
) {

  const number =
    Number(value);

  if (
    Number.isFinite(number)
  ) {
    return number;
  }

  return fallback;

}


/* =========================
   NORMALIZE HISTORY
========================= */

function normalizeHistory(
  history
) {

  if (
    !Array.isArray(history)
  ) {
    return [];
  }

  return history
    .map(item => {

      if (
        !item ||
        typeof item !== "object"
      ) {
        return null;
      }

      /*
        Keep BOTH "details" and "note"
        compatible with track.html.

        Older records may have "note".
        New records use "details".
      */

      const details =
        getText(
          item.details,
          ""
        ) ||
        getText(
          item.note,
          ""
        );

      return {

        status:
          getText(
            item.status,
            ""
          ),

        location:
          getLocation(
            item.location,
            ""
          ),

        details:
          details,

        note:
          details,

        date:
          getText(
            item.date,
            ""
          ),

        time:
          getText(
            item.time,
            ""
          )

      };

    })
    .filter(Boolean);

}


/* =========================
   NORMALIZE SHIPMENT
========================= */

function normalizeShipment(
  shipment
) {

  return {

    trackingNumber:
      getText(
        shipment.trackingNumber ||
        shipment.tracking,
        ""
      ),

    status:
      getText(
        shipment.status,
        "Pending"
      ),

    shipmentDate:
      getText(
        shipment.shipmentDate ||
        shipment.createdDate,
        ""
      ),

    estimatedDelivery:
      getText(
        shipment.estimatedDelivery,
        ""
      ),

    progress:
      Math.max(
        0,
        Math.min(
          100,
          getNumber(
            shipment.progress,
            0
          )
        )
      ),

    currentLocation:
      getLocation(
        shipment.currentLocation ||
        shipment.location,
        ""
      ),

    shipmentType:
      getText(
        shipment.shipmentType ||
        (
          shipment.package &&
          shipment.package.type
        ),
        ""
      ),

    weight:
      getText(
        shipment.weight ||
        (
          shipment.package &&
          shipment.package.weight
        ),
        ""
      ),

    customerName:
      getText(
        shipment.customerName,
        ""
      ),

    customerPhone:
      getText(
        shipment.customerPhone,
        ""
      ),

    customerEmail:
      getText(
        shipment.customerEmail,
        ""
      ),

    senderName:
      getText(
        shipment.senderName ||
        (
          shipment.sender &&
          shipment.sender.name
        ),
        ""
      ),

    senderPhone:
      getText(
        shipment.senderPhone ||
        (
          shipment.sender &&
          shipment.sender.phone
        ),
        ""
      ),

    senderAddress:
      getLocation(
        shipment.senderAddress ||
        (
          shipment.sender &&
          shipment.sender.address
        ),
        ""
      ),

    receiverName:
      getText(
        shipment.receiverName ||
        (
          shipment.receiver &&
          shipment.receiver.name
        ),
        ""
      ),

    receiverPhone:
      getText(
        shipment.receiverPhone ||
        (
          shipment.receiver &&
          shipment.receiver.phone
        ),
        ""
      ),

    receiverAddress:
      getLocation(
        shipment.receiverAddress ||
        (
          shipment.receiver &&
          shipment.receiver.address
        ),
        ""
      ),

    origin:
      getLocation(
        shipment.origin,
        ""
      ),

    destination:
      getLocation(
        shipment.destination,
        ""
      ),

    shipmentImage:
      getText(
        shipment.shipmentImage ||
        shipment.image,
        ""
      ),

    notes:
      getText(
        shipment.notes,
        ""
      ),

    transitHistory:
      normalizeHistory(
        shipment.transitHistory ||
        shipment.history
      )

  };

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type = "success"
) {

  message.textContent =
    text;

  message.className =
    "message " + type;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

  setTimeout(() => {

    message.className =
      "message";

    message.textContent =
      "";

  }, 4000);

}


/* =========================
   DATE
========================= */

function todayDate() {

  const now =
    new Date();

  const year =
    now.getFullYear();

  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );

  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );

  return `${year}-${month}-${day}`;

}


/* =========================
   SELECT VALUE
========================= */

function setSelectValue(
  selectId,
  value
) {

  const select =
    document.getElementById(
      selectId
    );

  if (!select) {
    return;
  }

  const stringValue =
    getText(
      value,
      ""
    );

  if (
    stringValue &&
    !Array.from(
      select.options
    ).some(
      option =>
        option.value ===
        stringValue
    )
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      stringValue;

    option.textContent =
      stringValue;

    select.appendChild(
      option
    );

  }

  select.value =
    stringValue;

}


/* =========================
   FORM RESET
========================= */

function resetForm() {

  form.reset();

  editingTrackingNumber =
    null;

  document.getElementById(
    "shipmentDate"
  ).value =
    todayDate();

  document.getElementById(
    "progress"
  ).value =
    0;

  document.getElementById(
    "formTitle"
  ).textContent =
    "Create Shipment";

  document.getElementById(
    "pageTitle"
  ).textContent =
    "Create Shipment";

  document.getElementById(
    "existingPhoto"
  ).textContent =
    "";

  document.getElementById(
    "historyStatus"
  ).value =
    "";

  document.getElementById(
    "historyLocation"
  ).value =
    "";

  document.getElementById(
    "historyNote"
  ).value =
    "";

}


/* =========================
   SHOW CREATE FORM
========================= */

function showCreateForm() {

  resetForm();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================
   EDIT SHIPMENT
========================= */

function editShipment(
  trackingNumber
) {

  const shipments =
    getShipments();

  const rawShipment =
    shipments.find(
      shipment =>
        getText(
          shipment.trackingNumber ||
          shipment.tracking
        ) === trackingNumber
    );

  if (!rawShipment) {

    showMessage(
      "Shipment not found.",
      "error"
    );

    return;
  }

  const shipment =
    normalizeShipment(
      rawShipment
    );

  editingTrackingNumber =
    shipment.trackingNumber;

  document.getElementById(
    "trackingNumber"
  ).value =
    shipment.trackingNumber;

  setSelectValue(
    "status",
    shipment.status
  );

  document.getElementById(
    "shipmentDate"
  ).value =

/* =========================
   DELETE SHIPMENT
========================= */

function deleteShipment(
  trackingNumber
) {

  const confirmed =
    confirm(
      "Are you sure you want to delete shipment " +
      trackingNumber +
      "?"
    );

  if (!confirmed) {
    return;
  }

  const shipments =
    getShipments();

  const updated =
    shipments.filter(
      shipment =>
        getText(
          shipment.trackingNumber ||
          shipment.tracking
        ) !== trackingNumber
    );

  saveShipments(
    updated
  );

  if (
    editingTrackingNumber ===
    trackingNumber
  ) {
    resetForm();
  }

  renderShipments();

  showMessage(
    "Shipment deleted successfully."
  );

}


/* =========================
   SAVE SHIPMENT
========================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const wasEditing =
      Boolean(
        editingTrackingNumber
      );

    const trackingNumber =
      document.getElementById(
        "trackingNumber"
      ).value.trim();

    if (!trackingNumber) {

      showMessage(
        "Please enter a tracking number.",
        "error"
      );

      return;
    }

    const shipments =
      getShipments();

    const existingIndex =
      shipments.findIndex(
        shipment =>
          getText(
            shipment.trackingNumber ||
            shipment.tracking
          ).toUpperCase() ===
          trackingNumber.toUpperCase()
      );

    if (
      existingIndex !== -1 &&
      (
        !editingTrackingNumber ||
        getText(
          shipments[
            existingIndex
          ].trackingNumber ||
          shipments[
            existingIndex
          ].tracking
        ).toUpperCase() !==
        editingTrackingNumber.toUpperCase()
      )
    ) {

      showMessage(
        "That tracking number already exists.",
        "error"
      );

      return;
    }

    let existingShipment =
      existingIndex !== -1
        ? normalizeShipment(
            shipments[
              existingIndex
            ]
          )
        : null;


    /* =========================
       PHOTO
    ========================= */

    let shipmentImage =
      existingShipment
        ? existingShipment.shipmentImage
        : "";

    const imageFile =
      document.getElementById(
        "shipmentImage"
      ).files[0];

    if (imageFile) {

      shipmentImage =
        await new Promise(
          resolve => {

            const reader =
              new FileReader();

            reader.onload =
              function() {

                resolve(
                  reader.result
                );

              };

            reader.onerror =
              function() {

                resolve(
                  ""
                );

              };

            reader.readAsDataURL(
              imageFile
            );

          }
        );

    }


    /* =========================
       TRANSIT HISTORY
    ========================= */

    let transitHistory =
      existingShipment
        ? normalizeHistory(
            existingShipment.transitHistory
          )
        : [];

    const historyStatus =
      document.getElementById(
        "historyStatus"
      ).value.trim();

    const historyLocation =
      document.getElementById(
        "historyLocation"
      ).value.trim();

    const historyNote =
      document.getElementById(
        "historyNote"
      ).value.trim();

    if (
      historyStatus ||
      historyLocation ||
      historyNote
    ) {

      transitHistory.push({

        status:
          historyStatus ||
          document.getElementById(
            "status"
          ).value,

        location:
          historyLocation,

        /*
          Save the update description
          using "details" for track.html,
          and "note" for backwards compatibility.
        */

        details:
          historyNote,

        note:
          historyNote,

        date:
          new Date().toISOString(),

        time:
          new Date().toLocaleTimeString(
            "en-US",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )

      });

    }


    /* =========================
       CREATE SHIPMENT OBJECT
    ========================= */

    const shipment = {

      trackingNumber:
        trackingNumber,

      status:
        document.getElementById(
          "status"
        ).value,

      shipmentDate:
        document.getElementById(
          "shipmentDate"
        ).value,

      estimatedDelivery:
        document.getElementById(
          "estimatedDelivery"
        ).value,

      progress:
        Math.max(
          0,
          Math.min(
            100,
            Number(
              document.getElementById(
                "progress"
              ).value
            ) || 0
          )
        ),

      currentLocation:
        document.getElementById(
          "currentLocation"
        ).value.trim(),

      shipmentType:
        document.getElementById(
          "shipmentType"
        ).value.trim(),

      weight:
        document.getElementById(
          "weight"
        ).value.trim(),

      customerName:
        document.getElementById(
          "customerName"
        ).value.trim(),

      customerPhone:
        document.getElementById(
          "customerPhone"
        ).value.trim(),

      customerEmail:
        document.getElementById(
          "customerEmail"
        ).value.trim(),

      senderName:
        document.getElementById(
          "senderName"
        ).value.trim(),

      senderPhone:
        document.getElementById(
          "senderPhone"
        ).value.trim(),

      senderAddress:
        document.getElementById(
          "senderAddress"
        ).value.trim(),

      receiverName:
        document.getElementById(
          "receiverName"
        ).value.trim(),

      receiverPhone:
        document.getElementById(
          "receiverPhone"
        ).value.trim(),

      receiverAddress:
        document.getElementById(
          "receiverAddress"
        ).value.trim(),

      origin:
        document.getElementById(
          "origin"
        ).value.trim(),

      destination:
        document.getElementById(
          "destination"
        ).value.trim(),

      shipmentImage:
        shipmentImage,

      notes:
        document.getElementById(
          "notes"
        ).value.trim(),

      transitHistory:
        transitHistory

    };


    /* =========================
       SAVE
    ========================= */

    if (
      existingIndex !== -1
    ) {

      shipments[
        existingIndex
      ] = shipment;

    } else {

      shipments.unshift(
        shipment
      );

    }

    saveShipments(
      shipments
    );


    /* =========================
       RESET
    ========================= */

    resetForm();

    renderShipments();

    showMessage(
      wasEditing
        ? "Shipment updated successfully."
        : "Shipment created successfully."
    );

  }
);


/* =========================
   RENDER SHIPMENTS
========================= */

function renderShipments() {

  const shipments =
    getShipments();

  if (
    !shipments.length
  ) {

    shipmentsList.innerHTML = `
      <div class="empty">
        No shipments have been created yet.
      </div>
    `;

    return;
  }

  shipmentsList.innerHTML =
    shipments
      .map(
        rawShipment => {

          const shipment =
            normalizeShipment(
              rawShipment
            );

          const safeTracking =
            escapeHtml(
              shipment.trackingNumber
            );

          const safeStatus =
            escapeHtml(
              shipment.status
            );

          const safeCustomer =
            escapeHtml(
              shipment.customerName ||
              "Not provided"
            );

          const safeOrigin =
            escapeHtml(
              shipment.origin ||
              "Not provided"
            );

          const safeDestination =
            escapeHtml(
              shipment.destination ||
              "Not provided"
            );

          const safeLocation =
            escapeHtml(
              shipment.currentLocation ||
              "Not provided"
            );

          return `

            <div class="shipment-card">

              <div class="shipment-header">

                <div>

                  <div class="tracking-number">
                    ${safeTracking}
                  </div>

                  <div class="small-note">
                    Shipment
                  </div>

                </div>

                <span class="status">
                  ${safeStatus}
                </span>

              </div>


              <div class="shipment-info">

                <div class="info-box">

                  <span class="info-label">
                    Customer
                  </span>

                  <span class="info-value">
                    ${safeCustomer}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Origin
                  </span>

                  <span class="info-value">
                    ${safeOrigin}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Destination
                  </span>

                  <span class="info-value">
                    ${safeDestination}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Current Location
                  </span>

                  <span class="info-value">
                    ${safeLocation}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Progress
                  </span>

                  <span class="info-value">
                    ${shipment.progress}%
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Estimated Delivery
                  </span>

                  <span class="info-value">
                    ${
                      escapeHtml(
                        shipment.estimatedDelivery ||
                        "Not provided"
                      )
                    }
                  </span>

                </div>

              </div>


              <div class="progress-wrapper">

                <div class="progress-bar">

                  <div
                    class="progress-fill"
                    style="width:${shipment.progress}%"
                  ></div>

                </div>

              </div>


              <div class="shipment-actions">

                <button
                  type="button"
                  class="btn btn-warning"
                  onclick="editShipment('${escapeJs(shipment.trackingNumber)}')"
                >
                  Edit
                </button>

                <button
                  type="button"
                  class="btn btn-danger"
                  onclick="deleteShipment('${escapeJs(shipment.trackingNumber)}')"
                >
                  Delete
                </button>

                <a
                  class="btn btn-secondary"
                  href="track.html?tracking=${encodeURIComponent(shipment.trackingNumber)}"
                  target="_blank"
                >
                  View Tracking
                </a>

              </div>


              ${
                shipment.transitHistory.length
                  ? `
                    <div style="margin-top:18px;">

                      <strong>
                        Recent Tracking Updates
                      </strong>

                      <div style="margin-top:10px;">

                        ${
                          shipment.transitHistory
                            .slice()
                            .reverse()
                            .slice(0, 3)
                            .map(
                              history => `

                                <div class="history-item">

                                  <strong>
                                    ${escapeHtml(
                                      history.status ||
                                      "Update"
                                    )}
                                  </strong>

                                  ${
                                    history.location
                                      ? `
                                        <div>
                                          ${escapeHtml(
                                            history.location
                                          )}
                                        </div>
                                      `
                                      : ""
                                  }

                                  ${
                                    history.details
                                      ? `
                                        <div>
                                          ${escapeHtml(
                                            history.details
                                          )}
                                        </div>
                                      `
                                      : ""
                                  }

                                  ${
                                    history.date
                                      ? `
                                        <div class="small-note">
                                          ${escapeHtml(
                                            formatDateTime(
                                              history.date
                                            )
                                          )}
                                        </div>
                                      `
                                      : ""
                                  }

                                </div>

                              `
                            )
                            .join("")
                        }

                      </div>

                    </div>
                  `
                  : ""
              }

            </div>

          `;

        }
      )
      .join("");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r/g,
      "\\r"
    )
    .replace(
      /\n/g,
      "\\n"
    );

}


/* =========================
   FORMAT DATE
========================= */

function formatDateTime(
  value
) {

  if (!value) {
    return "";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return value;
  }

  return date.toLocaleString();

}


/* =========================
   INITIAL LOAD
========================= */

document.getElementById(
  "shipmentDate"
).value =
  todayDate();

renderShipments();

</script>
