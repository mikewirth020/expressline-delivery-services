<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ExpressLine Delivery Services — reliable courier, shipping and logistics solutions.">
  <title>ExpressLine Delivery Services</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0B2E6B;
      --navy-dark: #071f4a;
      --orange: #F97316;
      --white: #FFFFFF;
      --light: #F4F6F8;
      --text: #374151;
      --muted: #6B7280;
      --border: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input {
      font-family: inherit;
    }

    /* NAVIGATION */

    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      color: white;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--orange);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: white;
      box-shadow: 0 8px 25px rgba(249,115,22,0.25);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 600;
    }

    .nav-links a {
      opacity: 0.92;
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #fed7aa;
    }

    .nav-button {
      background: var(--orange);
      padding: 11px 17px;
      border-radius: 8px;
      color: white !important;
    }

    .menu-button {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 28px;
      cursor: pointer;
    }

    /* HERO */

    .hero {
      min-height: 720px;
      position: relative;
      display: flex;
      align-items: center;
      color: white;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(5,25,60,0.96), rgba(11,46,107,0.82), rgba(11,46,107,0.45)),
        url("https://images.unsplash.com/photo-1586528116493-da8b6c5f6e5a?auto=format&fit=crop&w=1800&q=85")
        center/cover no-repeat;
    }

    .hero-container {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      padding: 150px 24px 90px;
    }

    .hero-content {
      max-width: 720px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .eyebrow span {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
    }

    .hero h1 {
      font-size: clamp(42px, 6vw, 72px);
      line-height: 1.04;
      letter-spacing: -2.8px;
      margin-bottom: 24px;
      font-weight: 800;
    }

    .hero h1 strong {
      color: #fb923c;
    }

    .hero-text {
      max-width: 620px;
      color: rgba(255,255,255,0.84);
      font-size: 18px;
      margin-bottom: 34px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border-radius: 8px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-orange {
      background: var(--orange);
      color: white;
      box-shadow: 0 12px 25px rgba(249,115,22,0.22);
    }

    .btn-outline {
      color: white;
      border-color: rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.06);
    }

    /* TRACKING CARD */

    .tracking-card {
      max-width: 1100px;
      margin: -60px auto 0;
      position: relative;
      z-index: 5;
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 20px 55px rgba(15,23,42,0.15);
      border: 1px solid var(--border);
    }

    .tracking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 18px;
    }

    .tracking-header h2 {
      color: var(--navy);
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .tracking-header p {
      color: var(--muted);
      font-size: 13px;
    }

    .tracking-form {
      display: flex;
      gap: 10px;
    }

    .tracking-input {
      flex: 1;
      min-width: 0;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      padding: 15px 16px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .tracking-input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(11,46,107,0.1);
    }

    .tracking-result {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: #FFF7ED;
      color: #9A3412;
      font-size: 14px;
      font-weight: 600;
    }

    /* SECTIONS */

    .section {
      padding: 95px 24px;
    }

    .section-light {
      background: var(--light);
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .section-heading {
      max-width: 680px;
      margin-bottom: 45px;
    }

    .section-heading.center {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .section-label {
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      color: var(--navy);
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.15;
      letter-spacing: -1.4px;
      margin-bottom: 14px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 16px;
    }

    /* SERVICES */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .service-card {
      background: white;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .service-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(15,23,42,0.09);
    }

    .service-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #EFF6FF;
      color: var(--navy);
      font-size: 22px;
      margin-bottom: 20px;
    }

    .service-card h3 {
      color: var(--navy);
      margin-bottom: 9px;
      font-size: 18px;
    }

    .service-card p {
      color: var(--muted);
      font-size: 14px;
    }

    /* STATS */

    .stats {
      background: var(--navy);
      color: white;
      padding: 60px 24px;
    }

    .stats-grid {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      text-align: center;
    }

    .stat h3 {
      font-size: 38px;
      margin-bottom: 4px;
    }

    .stat p {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
    }

    /* WHY US */

    .why-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .why-image {
      min-height: 430px;
      border-radius: 14px;
      background:
        linear-gradient(rgba(11,46,107,0.12), rgba(11,46,107,0.12)),
        url("https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?auto=format&fit=crop&w=1000&q=80")
        center/cover;
    }

    .feature-list {
      display: grid;
      gap: 20px;
    }

    .feature {
      display: flex;
      gap: 15px;
    }

    .check {
      flex: 0 0 34px;
      height: 34px;
      border-radius: 50%;
      background: #EFF6FF;
      color: var(--navy);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .feature h3 {
      color: var(--navy);
      margin-bottom: 3px;
      font-size: 16px;
    }

    .feature p {
      color: var(--muted);
      font-size: 14px;
    }

    /* CTA */

    .cta {
      margin: 0 24px 95px;
      border-radius: 16px;
      background: linear-gradient(110deg, var(--navy-dark), var(--navy
